name: 🔍 Listar Contas Financeiras

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependências
        run: pip install requests

      - name: Restaurar tokens.json
        run: echo '${{ secrets.CONTA_AZUL_TOKENS }}' > tokens.json

      - name: Listar contas e categorias
        env:
          CONTA_AZUL_CLIENT_ID:     ${{ secrets.CONTA_AZUL_CLIENT_ID }}
          CONTA_AZUL_CLIENT_SECRET: ${{ secrets.CONTA_AZUL_CLIENT_SECRET }}
        run: |
          python - <<'EOF'
          import json, base64, time, requests, os

          with open("tokens.json") as f:
              tokens = json.load(f)

          access_token = tokens["access_token"]

          if time.time() >= tokens["expires_at"] - 300:
              CLIENT_ID     = os.environ["CONTA_AZUL_CLIENT_ID"]
              CLIENT_SECRET = os.environ["CONTA_AZUL_CLIENT_SECRET"]
              b64 = base64.b64encode(f"{CLIENT_ID}:{CLIENT_SECRET}".encode()).decode()
              r = requests.post(
                  "https://auth.contaazul.com/oauth2/token",
                  headers={"Authorization": f"Basic {b64}", "Content-Type": "application/x-www-form-urlencoded"},
                  data={"grant_type": "refresh_token", "refresh_token": tokens["refresh_token"]},
              )
              r.raise_for_status()
              access_token = r.json()["access_token"]

          h = {"Authorization": f"Bearer {access_token}"}

          # 1. Contas financeiras
          print("===== CONTAS FINANCEIRAS =====")
          r = requests.get(
              "https://api-v2.contaazul.com/v1/conta-financeira",
              headers=h,
              params={"pagina": 1, "tamanho_pagina": 50, "apenas_ativo": True}
          )
          for c in r.json().get("itens", []):
              print(f"  [{c.get('tipo')}] {c.get('nome')} → ID: {c.get('id')}")

          # 2. Categorias de RECEITA
          print("\n===== CATEGORIAS DE RECEITA =====")
          r = requests.get(
              "https://api-v2.contaazul.com/v1/categorias",
              headers=h,
              params={"pagina": 1, "tamanho_pagina": 100, "tipo": "RECEITA",
                      "apenas_filhos": True, "permite_apenas_filhos": True}
          )
          for c in r.json().get("itens", []):
              print(f"  {c.get('nome')} → ID: {c.get('id')}")

          # 3. Categorias de DESPESA
          print("\n===== CATEGORIAS DE DESPESA =====")
          r = requests.get(
              "https://api-v2.contaazul.com/v1/categorias",
              headers=h,
              params={"pagina": 1, "tamanho_pagina": 100, "tipo": "DESPESA",
                      "apenas_filhos": True, "permite_apenas_filhos": True}
          )
          for c in r.json().get("itens", []):
              print(f"  {c.get('nome')} → ID: {c.get('id')}")
          EOF
