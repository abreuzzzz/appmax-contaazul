name: 🔍 Descobrir Endpoints Conta Azul

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependências
        run: pip install requests

      - name: Restaurar tokens.json
        run: echo '${{ secrets.CONTA_AZUL_TOKENS }}' > tokens.json

      - name: Testar endpoints
        env:
          CONTA_AZUL_CLIENT_ID:     ${{ secrets.CONTA_AZUL_CLIENT_ID }}
          CONTA_AZUL_CLIENT_SECRET: ${{ secrets.CONTA_AZUL_CLIENT_SECRET }}
        run: |
          python - <<'EOF'
          import json, base64, time, requests, os

          with open("tokens.json") as f:
              tokens = json.load(f)

          access_token = tokens["access_token"]

          if time.time() >= tokens["expires_at"] - 300:
              CLIENT_ID     = os.environ["CONTA_AZUL_CLIENT_ID"]
              CLIENT_SECRET = os.environ["CONTA_AZUL_CLIENT_SECRET"]
              b64 = base64.b64encode(f"{CLIENT_ID}:{CLIENT_SECRET}".encode()).decode()
              r = requests.post(
                  "https://auth.contaazul.com/oauth2/token",
                  headers={"Authorization": f"Basic {b64}", "Content-Type": "application/x-www-form-urlencoded"},
                  data={"grant_type": "refresh_token", "refresh_token": tokens["refresh_token"]},
              )
              r.raise_for_status()
              access_token = r.json()["access_token"]

          headers_get = {"Authorization": f"Bearer {access_token}"}
          headers_post = {"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"}

          # 1. Testa GET /v1/categorias (exemplo da documentação oficial)
          print("===== GET /v1/categorias (exemplo da doc) =====")
          r = requests.get("https://api-v2.contaazul.com/v1/categorias", headers=headers_get)
          print(f"Status: {r.status_code} | {r.text[:300]}")

          # 2. Testa todos os paths possíveis de contas a receber
          print("\n===== POST contas a receber =====")
          payload = {
              "descricao": "TESTE",
              "data_competencia": "2026-03-30",
              "parcelas": [{"descricao": "TESTE 1/1", "data_vencimento": "2026-04-30", "valor_bruto": 1.00}]
          }
          urls = [
              "https://api-v2.contaazul.com/v1/financeiro/contas-receber",
              "https://api-v2.contaazul.com/v1/contas-receber",
              "https://api-v2.contaazul.com/v1/financeiro/eventos-financeiros/receber",
              "https://api-v2.contaazul.com/v1/eventos-financeiros/contas-receber",
              "https://api-v2.contaazul.com/v1/financeiro/receitas",
          ]
          for url in urls:
              r = requests.post(url, headers=headers_post, json=payload)
              flag = "✅" if r.status_code not in [404] else "❌"
              print(f"{flag} [{r.status_code}] {url}")
              if r.status_code != 404:
                  print(f"    → {r.text[:300]}")
          EOF
