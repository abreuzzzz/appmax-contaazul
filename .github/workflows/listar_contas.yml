name: 🔍 Descobrir Endpoints Conta Azul

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependências
        run: pip install requests

      - name: Restaurar tokens.json
        run: echo '${{ secrets.CONTA_AZUL_TOKENS }}' > tokens.json

      - name: Testar endpoints
        env:
          CONTA_AZUL_CLIENT_ID:     ${{ secrets.CONTA_AZUL_CLIENT_ID }}
          CONTA_AZUL_CLIENT_SECRET: ${{ secrets.CONTA_AZUL_CLIENT_SECRET }}
        run: |
          python - <<'EOF'
          import json, base64, time, requests, os

          with open("tokens.json") as f:
              tokens = json.load(f)

          access_token = tokens["access_token"]

          if time.time() >= tokens["expires_at"] - 300:
              CLIENT_ID     = os.environ["CONTA_AZUL_CLIENT_ID"]
              CLIENT_SECRET = os.environ["CONTA_AZUL_CLIENT_SECRET"]
              b64 = base64.b64encode(f"{CLIENT_ID}:{CLIENT_SECRET}".encode()).decode()
              r = requests.post(
                  "https://auth.contaazul.com/oauth2/token",
                  headers={"Authorization": f"Basic {b64}", "Content-Type": "application/x-www-form-urlencoded"},
                  data={"grant_type": "refresh_token", "refresh_token": tokens["refresh_token"]},
              )
              r.raise_for_status()
              access_token = r.json()["access_token"]

          headers = {"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"}

          # Payload mínimo de teste
          payload_receber = {
              "descricao": "TESTE API",
              "data_competencia": "2026-03-30",
              "parcelas": [
                  {
                      "descricao": "TESTE API 1/1",
                      "data_vencimento": "2026-04-30",
                      "valor_bruto": 1.00
                  }
              ]
          }

          urls_post = [
              "https://api-v2.contaazul.com/financeiro/v1/eventos/contas-receber",
              "https://api-v2.contaazul.com/financeiro/v1/eventos-receber",
              "https://api-v2.contaazul.com/financeiro/v1/lancamentos/receber",
              "https://api-v2.contaazul.com/financeiro/v1/receber",
              "https://api-v2.contaazul.com/v1/financeiro/eventos/contas-receber",
              "https://api-v2.contaazul.com/financeiro/v1/contas-a-receber",
          ]

          print("===== TESTANDO POST CONTAS A RECEBER =====")
          for url in urls_post:
              r = requests.post(url, headers=headers, json=payload_receber)
              status = r.status_code
              resposta = r.text[:150].replace('\n','')
              flag = "✅" if status not in [404] else "❌"
              print(f"{flag} [{status}] {url}")
              if status not in [404]:
                  print(f"    → {resposta}")

          print("\n===== TESTANDO GET PARCELAS A RECEBER =====")
          urls_get = [
              "https://api-v2.contaazul.com/financeiro/v1/contas-receber/parcelas",
              "https://api-v2.contaazul.com/financeiro/v1/parcelas/receber",
              "https://api-v2.contaazul.com/financeiro/v1/receber/parcelas",
              "https://api-v2.contaazul.com/v1/financeiro/contas-receber/parcelas",
          ]
          for url in urls_get:
              r = requests.get(url, headers=headers, params={"tamanho_pagina": 1})
              status = r.status_code
              flag = "✅" if status == 200 else "❌"
              print(f"{flag} [{status}] {url}")
              if status == 200:
                  print(f"    → {r.text[:200]}")
          EOF
